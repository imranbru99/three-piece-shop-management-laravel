x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes: [".:/var/www/html"]
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: three_piece
    DB_USERNAME: three_piece
    DB_PASSWORD: local-only
    CACHE_STORE: redis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: three_piece
      MYSQL_USER: three_piece
      MYSQL_PASSWORD: local-only
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
volumes:
  mysql:
